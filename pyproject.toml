[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "reportlab>=4,<6", "email-validator>=2,<3", "filelock>=3,<5", "alembic>=1.13,<2", "python-multipart>=0.0.18", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/default/*.json", "static/*", "static/vendor/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
